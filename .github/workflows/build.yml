name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Stable Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Make Wrapper Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hotspot-unlock-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Publish APK as a GitHub Release (public download link)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk hotspot-unlock.apk
        gh release create "build-${{ github.run_number }}" hotspot-unlock.apk \
          --title "Build ${{ github.run_number }}" \
          --notes "Built from commit ${{ github.sha }}" \
          --target "${{ github.sha }}"
